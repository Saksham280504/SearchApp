databases:
  # --------------------------------------------------------------------------
  # PostgreSQL Database (Render managed)
  # --------------------------------------------------------------------------
  - name: search-app-db
    plan: free
    databaseName: searchapp
    user: searchapp_user
    region: oregon

services:
  # --------------------------------------------------------------------------
  # 1. Backend Service (Node.js Express)
  # --------------------------------------------------------------------------
  - type: web
    name: search-app-backend
    env: node
    plan: free
    region: oregon
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm run db:setup && node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: search-app-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://search-app-frontend-iigq.onrender.com

  # --------------------------------------------------------------------------
  # 2. Frontend Service (Static Site)
  # --------------------------------------------------------------------------
  - type: web
    name: search-app-frontend
    env: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
